<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" fill="none">
<!-- Static stone entrance at full illumination; the parent controls temporal darkness. -->
<defs>
<linearGradient id="baseStone" x1="664" y1="177" x2="269" y2="799" gradientUnits="userSpaceOnUse"><stop stop-color="#404d5d"/><stop offset=".28" stop-color="#2b3542"/><stop offset=".62" stop-color="#1b2532"/><stop offset="1" stop-color="#0e151f"/></linearGradient>
<linearGradient id="frontBevel" x1="613" y1="179" x2="318" y2="776" gradientUnits="userSpaceOnUse"><stop stop-color="#657383"/><stop offset=".22" stop-color="#3f5063"/><stop offset=".5" stop-color="#273545"/><stop offset="1" stop-color="#151f2c"/></linearGradient>
<linearGradient id="recess" x1="653" y1="265" x2="279" y2="703" gradientUnits="userSpaceOnUse"><stop stop-color="#293442"/><stop offset=".36" stop-color="#151e29"/><stop offset="1" stop-color="#0b121c"/></linearGradient>
<linearGradient id="rim" x1="618" y1="185" x2="316" y2="722" gradientUnits="userSpaceOnUse"><stop stop-color="#c2cbd6"/><stop offset=".28" stop-color="#8595a8"/><stop offset=".61" stop-color="#495b70"/><stop offset="1" stop-color="#293a4f"/></linearGradient>
<linearGradient id="lowerFade" x1="450" y1="135" x2="450" y2="855" gradientUnits="userSpaceOnUse"><stop stop-color="white"/><stop offset=".57" stop-color="white"/><stop offset=".76" stop-color="white" stop-opacity=".52"/><stop offset=".94" stop-color="white" stop-opacity="0"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
<linearGradient id="sideShade" x1="170" y1="430" x2="730" y2="215" gradientUnits="userSpaceOnUse"><stop stop-color="#010307" stop-opacity=".48"/><stop offset=".48" stop-color="#010307" stop-opacity=".14"/><stop offset="1" stop-color="#010307" stop-opacity="0"/></linearGradient>
<mask id="gateFade"><rect width="900" height="900" fill="url(#lowerFade)"/></mask>
<filter id="atmosphere" x="-20%" y="-15%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
<filter id="edgeSoft" x="-30%" y="-20%" width="160%" height="150%"><feGaussianBlur stdDeviation=".85"/></filter>
<filter id="stoneTexture" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".065 .13" numOctaves="3" seed="12" result="grain"/><feColorMatrix in="grain" type="matrix" values="0 0 0 0 .65 0 0 0 0 .68 0 0 0 0 .72 0 0 0 .055 0" result="grainTint"/><feComposite in="grainTint" in2="SourceGraphic" operator="in" result="surfaceGrain"/><feBlend in="SourceGraphic" in2="surfaceGrain" mode="soft-light"/><feGaussianBlur stdDeviation=".35"/></filter>
<radialGradient id="darkCentre" cx="0" cy="0" r="1" gradientTransform="translate(475 514) scale(175 228)" gradientUnits="userSpaceOnUse"><stop stop-color="#010204"/><stop offset=".55" stop-color="#010204" stop-opacity=".85"/><stop offset="1" stop-color="#010204" stop-opacity="0"/></radialGradient>
<path id="stoneMass" d="M166 808L171 408C176 223 294 111 459 119C636 127 745 238 738 416L730 812L637 812L644 429C647 308 578 235 462 230C346 226 278 303 276 424L269 808Z"/>
</defs>
<g mask="url(#gateFade)">
<!-- An outer softened mass establishes scale; actual surfaces remain readable at 800px. -->
<use href="#stoneMass" fill="#354252" opacity=".28" filter="url(#atmosphere)"/>
<!-- Compound open arch: no threshold, filled doorway, or concentric luminous rings. -->
<path d="M166 808L171 408C176 223 294 111 459 119C636 127 745 238 738 416L730 812L637 812L644 429C647 308 578 235 462 230C346 226 278 303 276 424L269 808Z" fill="url(#baseStone)" filter="url(#stoneTexture)"/>
<!-- One grazing front bevel, with a darker recessed reveal behind its inside edge. -->
<path d="M204 804L211 407C212 251 310 154 461 159C615 164 709 264 704 418L697 807L658 807L665 423C667 289 588 205 462 201C334 197 250 285 249 418L243 804Z" fill="url(#frontBevel)" filter="url(#edgeSoft)"/>
<path d="M243 804L249 418C250 285 334 197 462 201C588 205 667 289 665 423L658 807L637 812L644 429C647 308 578 235 462 230C346 226 278 303 276 424L269 808Z" fill="url(#recess)" filter="url(#edgeSoft)"/>
<!-- Broken silver catches: more focused than haze, never a complete bright outline. -->
<g stroke="url(#rim)" stroke-width="1.3" stroke-linecap="round" filter="url(#edgeSoft)">
<path d="M473 160C575 166 650 216 685 300"/>
<path d="M691 320C701 349 705 383 704 415L701 543"/>
<path d="M700 567L698 692"/>
<path d="M226 318C251 239 311 190 388 169"/>
<path d="M212 386L210 482"/>
<path d="M209 505L206 688"/>
</g>
<path d="M516 211C589 229 639 280 657 350" stroke="#8798ad" stroke-width=".8" filter="url(#edgeSoft)"/>
<path d="M659 371L656 530" stroke="#62778f" stroke-width=".7" filter="url(#edgeSoft)"/>
<!-- Quiet material breaks distinguish masonry from a polished vector symbol. -->
<g stroke="#090e16" stroke-opacity=".45" stroke-width="1.2" filter="url(#edgeSoft)">
<path d="M177 435L209 437M704 449L736 451"/>
<path d="M174 586L207 587M702 601L733 603"/>
<path d="M302 163L315 184M600 157L584 184"/>
<path d="M449 121L449 156"/>
</g>
<use href="#stoneMass" fill="url(#sideShade)"/>
</g>
<!-- Feathered black void; no jewel, reflection, halo or glint in this background layer. -->
<rect width="900" height="900" fill="url(#darkCentre)"/>
</svg>
